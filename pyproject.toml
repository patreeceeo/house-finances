[project]
name = "house-finances"
version = "0.1.0"
description = "Local categorizer, reports and Splitwise-style balances for a shared house bank account"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "babel>=2.18.0",
    "pyjwt[crypto]>=2.15.1",
    "streamlit",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
